// CQ6: For each route, count how many trips ran on it.
// Tests: Trip -> Route aggregation.
GQL
BASE <http://www.openlinksw.com/ontology/trucking-ontology#>
USE GRAPH <http://demo.openlinksw.com/trucking-ontology-benchmark/graph>
MATCH (tr::Trip)-[:trucking:route]->(r::Route)
RETURN r.routeName AS route_name, COUNT(tr) AS trip_count
GROUP BY route_name
ORDER BY trip_count DESC
