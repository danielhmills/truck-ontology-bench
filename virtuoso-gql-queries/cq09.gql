// CQ9: Trucks with a service ticket of severity 'critical'
// (mirrors scenario Q08).
// Tests: ServiceTicket -> Truck edge with a property filter on
// severity and a distinct count.
GQL
BASE <http://www.openlinksw.com/ontology/trucking-ontology#>
USE GRAPH <http://demo.openlinksw.com/trucking-ontology-benchmark/graph>
MATCH (s::ServiceTicket)-[:trucking:truck]->(t::Truck)
WHERE s.severity = 'critical'
RETURN DISTINCT t.truckNumber AS truck_number,
                t.make AS make,
                t.model AS model
LIMIT 25
