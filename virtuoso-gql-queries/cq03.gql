GQL
BASE <http://www.openlinksw.com/ontology/trucking-ontology#>
USE GRAPH <http://demo.openlinksw.com/trucking-ontology-benchmark/graph>

MATCH (l::DriverHOSLog)-[:trucking:driver]->(d::Driver)
RETURN DISTINCT d.firstName AS first_name, d.lastName AS last_name, d.employeeId AS employee_id
LIMIT 20
