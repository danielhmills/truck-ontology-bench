// CQ5: How many loads per customer industry?
// Tests: Load -> Customer edge with a group-by on a customer attribute.
GQL
BASE <http://www.openlinksw.com/ontology/trucking-ontology#>
USE GRAPH <http://demo.openlinksw.com/trucking-ontology-benchmark/graph>
MATCH (l::Load)-[:trucking:customer]->(c::Customer)
RETURN c.industry AS industry, COUNT(l) AS load_count
GROUP BY industry
ORDER BY load_count DESC
